# ===== Настройка Edge Functions =====
# telegram-auth вызывается ДО того, как у пользователя появится сессия
# (это и есть сам вход) — поэтому ей нужно разрешить работать без
# предварительной JWT-проверки на шлюзе (verify_jwt = false). Без этой
# строчки Supabase по умолчанию требует валидный пользовательский токен
# ещё до того, как код функции вообще запустится, и любой вызов
# получает 401 — это и была основная причина "нет связи с сервером".
#
# telegram-link, наоборот, специально ТРЕБУЕТ токен уже вошедшего
# пользователя (см. код функции) — поэтому для неё оставляем проверку
# включённой (значение по умолчанию, отдельно указывать не нужно).
[functions.telegram-auth]
verify_jwt = false
